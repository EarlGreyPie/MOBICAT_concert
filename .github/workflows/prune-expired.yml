# 기한(이름 맨 앞 yyyy-MM-dd)이 지난 연주회 묶음 첨부를 지운다(I-319). 앱은 이미 무시하지만 공개 저장소에 오래 두지 않는다.
name: prune expired concert bundles
on:
  schedule:
    - cron: "0 0 * * 1"   # 월요일 00:00 UTC = 09:00 한국 시각
  workflow_dispatch:
permissions:
  contents: write
jobs:
  prune:
    runs-on: ubuntu-latest
    steps:
      - name: delete expired assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          today=$(TZ=Asia/Seoul date +%F)
          gh api "repos/$REPO/releases?per_page=100" --paginate --jq '.[].assets[] | "\(.id)\t\(.name)"' |
          while IFS=$'\t' read -r id name; do
            expires=${name:0:10}
            if [[ "$name" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}_[0-9a-f]{32}_[0-9]{8}\.mocat$ && "$expires" < "$today" ]]; then
              echo "delete $name"
              gh api -X DELETE "repos/$REPO/releases/assets/$id"
            fi
          done
